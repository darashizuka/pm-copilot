model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  quantization: "4bit"  # QLoRA
  dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.05
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/sft"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 3
  weight_decay: 0.01
  max_length: 2048
  logging_steps: 10
  save_strategy: "epoch"
  bf16: true

dataset:
  path: "shizukadara2/pm-copilot-sft"
  split: "train"
  max_samples: 2000
  val_ratio: 0.05
